<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#913a7c" />
      <stop offset="100%" stop-color="#4a154b" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4d6" />
      <stop offset="100%" stop-color="#fbc7af" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>

  <!-- Puppet Hair Tufts -->
  <circle cx="40" cy="32" r="14" fill="url(#hairGrad)"/>
  <circle cx="60" cy="26" r="16" fill="url(#hairGrad)"/>
  <circle cx="80" cy="32" r="14" fill="url(#hairGrad)"/>

  <!-- Puppet Ears -->
  <circle cx="28" cy="62" r="9" fill="#fbc7af"/>
  <circle cx="92" cy="62" r="9" fill="#fbc7af"/>

  <!-- Puppet Face -->
  <ellipse cx="60" cy="64" rx="34" ry="30" fill="url(#faceGrad)"/>

  <!-- Puppet Characteristic Felt Seam Lines -->
  <path d="M60 38 L60 52" stroke="#e09d80" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,3"/>
  <path d="M42 64 Q60 68 78 64" stroke="#e09d80" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>

  <!-- Puppet Big Expressive Cartoon Eyes -->
  <!-- Left Eye -->
  <ellipse cx="46" cy="56" rx="7.5" ry="9.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="47.5" cy="56.5" r="5" fill="#1e293b"/>
  <circle cx="49" cy="54" r="2.2" fill="#ffffff"/>
  <!-- Right Eye -->
  <ellipse cx="74" cy="56" rx="7.5" ry="9.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="75.5" cy="56.5" r="5" fill="#1e293b"/>
  <circle cx="77" cy="54" r="2.2" fill="#ffffff"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="38" cy="68" rx="5" ry="3.5" fill="#f43f5e" opacity="0.45"/>
  <ellipse cx="82" cy="68" rx="5" ry="3.5" fill="#f43f5e" opacity="0.45"/>

  <!-- Cute Red Puppet Nose -->
  <circle cx="60" cy="61" r="4.5" fill="#ef4444"/>

  <!-- Big Happy Puppet Mouth (Muppet open mouth style) -->
  <path d="M44 72 Q60 92 76 72 Z" fill="#991b1b" stroke="#7f1d1d" stroke-width="1.5"/>
  <!-- Tongue -->
  <path d="M52 81 Q60 88 68 81 Q60 76 52 81 Z" fill="#f43f5e"/>

  <!-- Cute Colorful Bow Tie -->
  <g transform="translate(0, 10)">
    <polygon points="46,84 60,89 46,94" fill="url(#bowGrad)"/>
    <polygon points="74,84 60,89 74,94" fill="url(#bowGrad)"/>
    <circle cx="60" cy="89" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
  </g>

  <!-- Sparkle Magic Stars -->
  <path d="M96 28 L98 22 L100 28 L106 30 L100 32 L98 38 L96 32 L90 30 Z" fill="#fbbf24"/>
  <path d="M18 42 L19.5 38 L21 42 L25 43.5 L21 45 L19.5 49 L18 45 L14 43.5 Z" fill="#fbbf24"/>
</svg>
